name: Build Windows app

# Rebuilds RigKit.exe when the app code changes. Content edits (content/**)
# do not need a rebuild: the app reads them live from this repository.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src-tauri/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build exe
        run: npx --yes @tauri-apps/cli@^2 build --no-bundle

      - name: Rename
        shell: bash
        run: |
          cp src-tauri/target/release/rig-kit.exe RigKit.exe
          ls -la RigKit.exe

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rig Kit (latest)
          body: Download **RigKit.exe** below and run it. No install needed (Windows 10/11). Content updates appear automatically; you only need a new exe when the app itself changes.
          files: RigKit.exe
          make_latest: true
