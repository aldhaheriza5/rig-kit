[package]
name = "rig-kit"
version = "1.0.0"
description = "Rig Kit"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

# Keep the exe small
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
